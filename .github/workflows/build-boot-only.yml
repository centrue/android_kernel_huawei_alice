name: Build boot.img (TCPMSS comparison)

on:
  workflow_dispatch:
    inputs:
      enable_tcpmss:
        description: Enable CONFIG_NETFILTER_XT_TARGET_TCPMSS
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libncurses5-dev xz-utils curl
      - name: Build kernel and repack boot image
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euo pipefail
          TOOLCHAIN="$RUNNER_TEMP/gcc-7"
          # The original Linaro archive URL now redirects to a contact page.
          # This mirror exposes the same GCC 7.3.1 archive as a real tarball.
          TOOLCHAIN_URL='https://sources.libreelec.tv/mirror/gcc-linaro-aarch64-linux-gnu/gcc-linaro-aarch64-linux-gnu-7.3.1-2018.05.tar.xz'
          mkdir -p "$TOOLCHAIN"
          curl --fail --location --retry 3 "$TOOLCHAIN_URL" -o "$RUNNER_TEMP/gcc-7.tar.xz"
          tar -xJf "$RUNNER_TEMP/gcc-7.tar.xz" --strip-components=1 -C "$TOOLCHAIN"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-gnu-"
          "$CROSS_COMPILE"gcc --version | head -1
          # The 3.10 kbuild uses composite-object rules that are incompatible
          # with GNU Make 4.3 on the runner (empty ld -r dependency lists).
          curl --fail --location --retry 3 \
            https://ftp.gnu.org/gnu/make/make-4.2.1.tar.gz -o "$RUNNER_TEMP/make.tar.gz"
          tar -xzf "$RUNNER_TEMP/make.tar.gz" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/make-4.2.1" && ./configure --prefix="$RUNNER_TEMP/make-4.2.1/out" >/dev/null && make -j"$(nproc)" >/dev/null && make install >/dev/null)
          export PATH="$RUNNER_TEMP/make-4.2.1/out/bin:$PATH"
          make --version | head -1
          make alice_defconfig
          if [ '${{ inputs.enable_tcpmss }}' = true ]; then
            sed -i 's/^# CONFIG_NETFILTER_XT_TARGET_TCPMSS is not set/CONFIG_NETFILTER_XT_TARGET_TCPMSS=y/' .config
          fi
          make olddefconfig
          # GCC 14 on the self-hosted Debian runner promotes this legacy
          # kernel's intentional `return 0` in a void exception handler to an
          # error. Keep the source unchanged and disable only that new warning.
          make CROSS_COMPILE="$CROSS_COMPILE" KCFLAGS='-Wno-return-mismatch -Wno-error=implicit-function-declaration' -j"$(nproc)" Image
          mkdir -p "$RUNNER_TEMP/magisk"
          curl -fsSL -o "$RUNNER_TEMP/magisk/magiskboot.xz" https://github.com/topjohnwu/Magisk/releases/latest/download/magiskboot.xz
          xz -df "$RUNNER_TEMP/magisk/magiskboot.xz"
          chmod +x "$RUNNER_TEMP/magisk/magiskboot"
          cp prebuilt/base-boot.img "$RUNNER_TEMP/base-boot.img"
          cd "$RUNNER_TEMP/magisk"
          ./magiskboot unpack ../base-boot.img
          cp "$GITHUB_WORKSPACE/arch/arm64/boot/Image" kernel
          ./magiskboot repack ../base-boot.img ../boot.img
          sha256sum ../boot.img | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: boot-img-tcpmss-${{ inputs.enable_tcpmss }}
          path: ${{ runner.temp }}/boot.img
          if-no-files-found: error
